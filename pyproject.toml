[project]
name = "proxmox-mcp-server"
version = "2.4.0"
description = "MCP server for managing Proxmox Virtual Environment with AI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ry-ops", email = ""},
]
keywords = [
    "mcp",
    "proxmox",
    "model-context-protocol",
    "claude",
    "ai",
    "virtualization",
    "devops",
    "infrastructure",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = [
    # mcp 2.x removed the @app.list_tools()/@app.call_tool() decorator API used in server.py.
    "mcp>=1.30.0,<2",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    # Floors sit above known advisories: pyjwt 2.10.1 (CVE-2024-53861), starlette 0.49.1
    # (CVE-2025-54121, CVE-2025-62727). The exact, hashed versions live in uv.lock.
    # Cloudflare Access JWT validation (RS256 against the team JWKS).
    "pyjwt[crypto]>=2.15.1,<3",
    # Streamable HTTP transport (both already pulled in by mcp; pinned here because we import them).
    "starlette>=0.49.1",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/ry-ops/proxmox-mcp-server"
Documentation = "https://github.com/ry-ops/proxmox-mcp-server#readme"
Repository = "https://github.com/ry-ops/proxmox-mcp-server"
Issues = "https://github.com/ry-ops/proxmox-mcp-server/issues"
Changelog = "https://github.com/ry-ops/proxmox-mcp-server/blob/main/CHANGELOG.md"

[project.scripts]
proxmox-mcp-server = "proxmox_mcp.server:run"
proxmox-mcp-http = "proxmox_mcp.transport.http_app:main"
proxmox-mcp-audit-verify = "proxmox_mcp.audit:main"
proxmox-mcp-protect-credential = "proxmox_mcp.credentials:protect_main"
proxmox-mcp-selfcheck = "proxmox_mcp.selfcheck:main"

[build-system]
# Pinned so the wheel build is reproducible; CI builds without isolation from the hashed
# toolchain in requirements/ci-tools.txt, which pins the same version.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proxmox_mcp"]

# Dev tooling. Exact pins: the formatter's output and the linter's rule set change between
# releases, so a floating ruff turns CI red on an unrelated PR. Dependabot bumps these as a
# group (.github/dependabot.yml). black and mypy were removed: neither ran in CI and ruff
# covers formatting. Security tools (pip-audit, cyclonedx-bom) are pinned in
# requirements/ci-tools.txt with hashes instead, so they never enter the broker's lock.
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]

[tool.uv]
# Supply-chain cooldown: resolve only artifacts uploaded at least 7 days ago, so a hijacked
# release is usually yanked before it can reach the lock. For an urgent security fix, add a
# per-package override: exclude-newer-package = { "<pkg>" = "<RFC 3339 timestamp>" }.
exclude-newer = "7 days"
# certifi: PYSEC-2026-4320 is fixed in 2026.10.19 (uploaded 2026-10-20), inside the cooldown.
# A fixed cutoff also freezes certifi there: remove this override after 2026-10-27, when the
# fix is older than the cooldown window, so certifi updates resume.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }
# Floor for the same advisory, so a later re-lock cannot fall back below the fix.
constraint-dependencies = ["certifi>=2026.10.19"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "htmlcov", "worker"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "S",  # flake8-bandit: security lint (CC7.1). Every ignore below carries its justification.
]
ignore = [
    "E501", # line too long (the formatter owns line length)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
# Tests: S101 pytest asserts; S104/S105/S106 fixed fake hosts, secrets and passwords used as
# test inputs; S110 deliberate swallow while asserting a side effect; S603 subprocess runs
# sys.executable with a fixed argv.
"tests/**" = ["S101", "S104", "S105", "S106", "S110", "S603"]

[tool.coverage.run]
source = ["proxmox_mcp"]

[tool.coverage.report]
# Measured 91.85% line coverage at 4bf8310 (445 tests), rounded down. CI fails below this.
# Raise it as coverage grows; never lower it.
fail_under = 91
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=proxmox_mcp",
    "--cov-report=term-missing",
    "--cov-report=html",
]
asyncio_mode = "auto"
