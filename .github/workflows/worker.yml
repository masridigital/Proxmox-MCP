name: Worker (Cloudflare MCP gateway)

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  pull_request:
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Audit runtime dependencies (must be clean)
        run: npm audit --omit=dev

      - name: Audit dev dependencies (high and critical)
        run: npm audit --audit-level=high

      - name: Template has placeholders only
        run: |
          # The committed wrangler.jsonc must not carry real environment values.
          # (`! cmd` does not trip `set -e`, so test explicitly.)
          if grep -nE '"(service_id|namespace_id)": "[^<]|https://[a-z0-9-]+\.cloudflareaccess\.com|"(CF_ACCESS_AUD|WORKER_HOSTNAME|IDENTITY_KEY_ID)": "[^<]' wrangler.jsonc; then
            echo "::error::wrangler.jsonc must contain placeholders only"
            exit 1
          fi

      - name: Validate wrangler config and bundle (dry run, no credentials)
        run: npx wrangler deploy --dry-run --outdir dist
        env:
          WRANGLER_SEND_METRICS: "false"
