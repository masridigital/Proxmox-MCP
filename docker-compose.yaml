# Proxmox MCP broker: Linux LAB use only.
#
# Production runs on Windows Server 2025; follow docs/RUNBOOK.md. This file
# replaces the upstream compose file, which passed a shared Proxmox token through
# .env and turned TLS verification off.
#
# Before "docker compose up":
#   1. Put enrollment.json, pve-token-<name> and worker-identity.pub in
#      ./credentials, owned by uid 10001, mode 0400. Never commit that directory.
#   2. Set the variables below in the shell or in .env (settings only, no secrets).
#   3. Run cloudflared in this service's network namespace
#      (network_mode: "service:broker"); the broker listens on 127.0.0.1 only.
services:
  broker:
    build: .
    image: proxmox-mcp-broker:lab
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # No "ports:" on purpose. Nothing is published to the host network.
    environment:
      PROXMOX_HOST: ${PROXMOX_HOST:?set PROXMOX_HOST}
      PROXMOX_PORT: ${PROXMOX_PORT:-8006}
      PROXMOX_TLS_FINGERPRINT: ${PROXMOX_TLS_FINGERPRINT:?set PROXMOX_TLS_FINGERPRINT}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:?set CF_ACCESS_TEAM_DOMAIN}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:?set CF_ACCESS_AUD}
      BROKER_ALLOWED_SERVICE_CLIENT_IDS: ${BROKER_ALLOWED_SERVICE_CLIENT_IDS:?set BROKER_ALLOWED_SERVICE_CLIENT_IDS}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:?set MCP_ALLOWED_HOSTS}
      MCP_ALLOW_ADMIN_TOOLS: "0"
    volumes:
      - ./credentials:/run/credentials/proxmox-mcp:ro
      - audit:/var/log/proxmox-mcp
    tmpfs:
      - /tmp

volumes:
  audit:
